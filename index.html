<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt Vault - AI Prompt Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11417937' data-sdk='show_11417937'></script>
    
    <!-- Cloudinary Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <!-- Background Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Main App Container -->
    <div id="app">
        <!-- Header -->
        <header class="header glass">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-crown"></i>
                    <span>Prompt Vault</span>
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="search-toggle" id="searchToggle" aria-label="Toggle search">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container" id="searchContainer">
            <div class="search-box glass">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search prompts, categories..." autocomplete="off">
                <button id="clearSearch" class="clear-search">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="nav-tabs glass">
            <button class="nav-tab active" data-tab="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="nav-tab" data-tab="trending">
                <i class="fas fa-fire"></i>
                <span>Trending</span>
            </button>
            <button class="nav-tab" data-tab="featured">
                <i class="fas fa-star"></i>
                <span>Featured</span>
            </button>
            <button class="nav-tab" data-tab="categories">
                <i class="fas fa-th-list"></i>
                <span>Categories</span>
            </button>
        </nav>

        <!-- Category Chips -->
        <div class="category-chips" id="categoryChips">
            <div class="chip-loading">Loading categories...</div>
        </div>

        <!-- Prompts Grid -->
        <main class="prompts-grid" id="promptsGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading prompts...</p>
            </div>
        </main>

        <!-- Promotion Banner -->
        <div class="promotion-banner glass">
            <div class="promotion-content">
                <i class="fas fa-rocket"></i>
                <div class="promotion-text">
                    <h4>Join Our Community</h4>
                    <p>Get daily prompts & exclusive content</p>
                </div>
                <div class="promotion-links">
                    <a href="https://t.me/+GKfm_HwivHM1YWFl" target="_blank" class="promo-btn telegram-btn">
                        <i class="fab fa-telegram"></i>
                    </a>
                    <a href="https://www.whatsapp.com/channel/0029Vb6Uy0dCRs1phBNPrq0a" target="_blank" class="promo-btn whatsapp-btn">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-links">
                <a href="#" data-page="about">
                    <i class="fas fa-info-circle"></i> About
                </a>
                <a href="#" data-page="privacy">
                    <i class="fas fa-shield-alt"></i> Privacy
                </a>
                <a href="#" data-page="terms">
                    <i class="fas fa-file-contract"></i> Terms
                </a>
                <a href="https://t.me/+4s4mTS5NRi02M2E1" target="_blank">
                    <i class="fab fa-telegram"></i> Channel
                </a>
                <a href="#" data-page="contact">
                    <i class="fas fa-envelope"></i> Contact
                </a>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Prompt Vault. All rights reserved.</p>
            </div>
        </footer>

        <!-- Floating Telegram Button -->
        <button class="floating-telegram" id="floatingTelegram" aria-label="Telegram Group">
            <i class="fab fa-telegram-plane"></i>
        </button>
    </div>

    <!-- Prompt Modal -->
    <div class="modal" id="promptModal">
        <div class="modal-content glass">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Page Modal (For About, Privacy, Terms, Contact) -->
    <div class="modal" id="pageModal">
        <div class="modal-content glass" style="max-height: 90vh; overflow-y: auto;">
            <button class="modal-close" id="pageModalClose">
                <i class="fas fa-times"></i>
            </button>
            <div class="page-content" id="pageContent">
                <!-- Dynamic page content -->
            </div>
        </div>
    </div>

    <!-- Ad Overlay -->
    <div class="ad-overlay" id="adOverlay" style="display: none;">
        <div class="ad-content glass">
            <i class="fas fa-play-circle"></i>
            <h3>Watch Ad to Unlock</h3>
            <p>Please watch this short ad to access the full prompt.</p>
            <div class="ad-progress">
                <div class="ad-progress-bar" id="adProgress"></div>
            </div>
            <div class="ad-timer" id="adTimer">0s</div>
            <button class="btn btn-secondary" id="adSkipBtn">
                <i class="fas fa-forward"></i> Skip (Demo)
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
